    @media(max-width:768px){.projects-grid{grid-template-columns:1fr}.project-card.featured{grid-column:span 1}.modal-content .feature-grid{grid-template-columns:1fr}.modal-header,.modal-content,.modal-footer{padding-left:1.5rem;padding-right:1.5rem}.modal-container{padding:1rem}.modal-footer{flex-direction:column}.modal-btn{width:100%;justify-content:center}}

        statusLabel: "Live",
        emoji: "&#9878;&#65039;",
        title: "CompareMuffin",
        tagline: "AI-powered comparison tool that lets you compare anything — products, tools, ideas, career paths — and get structured analysis with scoring and real reasoning.",

        links: {
          live: "https://comparemuffin.com",

        },
        content: "<h2>The Problem</h2><p>Every day we face decisions: which tool to use, which career path to take, which product to buy. We spend hours reading reviews, comparing specs, and still feel uncertain. Most comparison sites are either biased, incomplete, or only cover specific product categories.</p><h2>The Solution</h2><p>CompareMuffin lets you drop in any two options and get a structured AI analysis instantly:</p><div class=\"feature-grid\"><div class=\"feature-item\"><h4>&#9878;&#65039; Compare Anything</h4><p>Products, tools, ideas, career paths, decisions &mdash; no category limits</p></div><div class=\"feature-item\"><h4>&#127919; Smart Verdicts</h4><p>AI-powered winner selection with confidence scoring and reasoning</p></div><div class=\"feature-item\"><h4>&#128200; Scoring Matrix</h4><p>Detailed breakdown across multiple dimensions with HIGH/MED/LOW ratings</p></div><div class=\"feature-item\"><h4>&#128274; Full Reports</h4><p>Comprehensive pros/cons, key differences, and actionable insights</p></div></div><h2>How It Works</h2><ul><li><strong>Drop two options:</strong> Type in anything you want to compare</li><li><strong>AI analyzes:</strong> Structured reasoning across multiple dimensions</li><li><strong>Get your verdict:</strong> Clear winner with confidence level and category tags</li><li><strong>Dive deeper:</strong> Unlock full scoring matrix and detailed reasoning</li></ul><div class=\"highlight\"><div class=\"highlight-title\">Current Status</div><p>CompareMuffin is live and free to use! No signup required to try it. Google sign-in available to save your comparisons.</p></div><h2>Why I Built This</h2><p>I found myself constantly asking AI chatbots to compare things for me, but the responses were always unstructured walls of text. CompareMuffin takes that same AI power and wraps it in a clean, structured format that actually helps you decide.</p>"

      {
        id: 2,
        featured: false,
        type: "work",
        typeLabel: "At Work",
        status: "live",
        statusLabel: "Active",
        emoji: "&#129302;",
        title: "Autom Mate AI Agents",
        tagline: "Ready-to-use AI Agents that customers can plug into their IT environments.",
        excerpt: "Contributing to AI Agents for support flows, approvals, ticket analysis, and more.",
        tech: ["AI Agents", "OpenAI", "LangChain", "ServiceNow", "Xurrent", "Python"],
        year: "2023-Present",
        links: {
          live: "https://autommate.com",
          github: null
        },
        content: "<h2>What We Build</h2><p>At Autom Mate, I work on the AI Agent capabilities that help IT teams automate their workflows. These are not chatbots that answer questions. They are agents that actually do things.</p><h2>Agent Types</h2><div class=\"feature-grid\"><div class=\"feature-item\"><h4>&#127919; Ticket Triage Agent</h4><p>Automatically classifies, prioritizes, and routes incoming tickets</p></div><div class=\"feature-item\"><h4>&#128218; Knowledge Agent</h4><p>Searches internal docs and past tickets to suggest solutions</p></div><div class=\"feature-item\"><h4>&#9989; Approval Agent</h4><p>Handles change management workflows and collects approvals</p></div><div class=\"feature-item\"><h4>&#128202; Analytics Agent</h4><p>Generates insights from ticket patterns and team performance</p></div></div><h2>My Contributions</h2><p>I focus on the integration layer, specifically how these agents connect to existing ITSM platforms without requiring customers to change their workflows:</p><ul><li>Designing the ServiceNow and Xurrent connectors</li><li>Building the orchestration logic that coordinates multiple agents</li><li>Creating the confidence scoring system that knows when to escalate to humans</li><li>Working with customers to understand real-world edge cases</li></ul><div class=\"highlight\"><div class=\"highlight-title\">Philosophy</div><p>The best AI agents are invisible. Users should not have to think about using AI. They should just notice that tickets get resolved faster and less manual work is required.</p></div><h2>What I Have Learned</h2><p>Enterprise AI is 20% model work and 80% integration work. The LLM is the easy part. Getting data in and out of legacy systems, handling authentication, managing rate limits, dealing with inconsistent data, that is where the real challenges live.</p>"
      },

        status: "live",
        statusLabel: "Live",
        emoji: "&#127760;",

        excerpt: "Built with vanilla HTML/CSS/JS because sometimes you do not need a framework.",
        tech: ["HTML", "CSS", "JavaScript", "No Framework"],
        year: "2024",
        links: {
          live: null,
          github: null
        },
        content: "<h2>Why Build From Scratch?</h2><p>I could have used Next.js, Astro, or any of the dozen static site generators out there. Instead, I wrote vanilla HTML, CSS, and JavaScript.</p><p>Why? A few reasons:</p><ul><li><strong>Performance:</strong> Zero JavaScript framework overhead. The page loads instantly.</li><li><strong>Simplicity:</strong> No build step. Edit a file, refresh the browser. Done.</li><li><strong>Learning:</strong> It is easy to forget the fundamentals when you always reach for frameworks.</li><li><strong>Control:</strong> Every line of code is mine. No fighting with framework opinions.</li></ul><div class=\"highlight\"><div class=\"highlight-title\">No Dependencies</div><p>The entire site has zero npm packages, zero build tools, and zero JavaScript frameworks. Just files served by a static host.</p></div>"

    var projectsGrid = document.getElementById("projects-grid");
    function renderProjects(filter) {
      filter = filter || "all";
      projectsGrid.innerHTML = "";
      var filtered = filter === "all" ? projects : projects.filter(function(p) { return p.type === filter; });
      filtered.forEach(function(project, index) {
        var card = document.createElement("article");
        card.className = "project-card" + (project.featured ? " featured" : "");
        card.dataset.type = project.type; card.dataset.id = project.id;
        card.style.animationDelay = (0.05 + index * 0.05) + "s";
        var statusClass = project.status === "live" ? " live" : (project.status === "dev" ? " dev" : "");
        card.innerHTML =
          "<div class=\"project-visual\"><div class=\"project-emoji\">" + project.emoji + "</div></div>" +
          "<div class=\"project-info\">" +
            "<div class=\"project-header\"><span class=\"project-type " + project.type + "\">" + project.typeLabel + "</span><span class=\"project-status" + statusClass + "\">" + project.statusLabel + "</span></div>" +
            "<h3 class=\"project-title\">" + project.title + "</h3>" +
            "<p class=\"project-excerpt\">" + project.excerpt + "</p>" +
            "<div class=\"project-tech\">" + project.tech.slice(0,4).map(function(t){return "<span>"+t+"</span>"}).join("") + "</div>" +
            "<div class=\"project-footer\"><span class=\"project-meta\">" + project.year + "</span>" +
              "<div class=\"project-arrow\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"7\" y1=\"17\" x2=\"17\" y2=\"7\"></line><polyline points=\"7 7 17 7 17 17\"></polyline></svg></div>" +
            "</div></div>";
        card.addEventListener("click", function() { openModal(project); });
        projectsGrid.appendChild(card);
      });
    }
    renderProjects();
    var filterTabs = document.querySelectorAll(".filter-tab");
    filterTabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        filterTabs.forEach(function(t){t.classList.remove("active")}); tab.classList.add("active");
        renderProjects(tab.dataset.filter);
      });
    });
    var modalOverlay=document.getElementById("modal-overlay"),modalContainer=document.getElementById("modal-container"),modalHero=document.getElementById("modal-hero"),modalHeader=document.getElementById("modal-header"),modalContent=document.getElementById("modal-content"),modalFooter=document.getElementById("modal-footer"),modalClose=document.getElementById("modal-close");
    function openModal(project) {
      var statusClass = project.status==="live"?" live":(project.status==="dev"?" dev":"");
      modalHero.innerHTML="<div class=\"modal-hero-emoji\">"+project.emoji+"</div>";
      modalHeader.innerHTML="<div class=\"modal-label\"><span class=\"project-type "+project.type+"\">"+project.typeLabel+"</span><span class=\"project-status"+statusClass+"\">"+project.statusLabel+"</span></div><h1 class=\"modal-title\">"+project.title+"</h1><p class=\"modal-tagline\">"+project.tagline+"</p><div class=\"modal-meta\"><div class=\"modal-meta-item\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\" ry=\"2\"></rect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"></line><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"></line><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"></line></svg>"+project.year+"</div></div><div class=\"modal-tech\">"+project.tech.map(function(t){return"<span>"+t+"</span>"}).join("")+"</div>";
      modalContent.innerHTML=project.content;
      var footerHtml="";
      if(project.links.live){footerHtml+="<a href=\""+project.links.live+"\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"modal-btn primary\">Visit Live Site <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M17 7H7M17 7v10\"/></svg></a>";}
      if(project.links.github){footerHtml+="<a href=\""+project.links.github+"\" target=\"_blank\" rel=\"noopener noreferrer\" class=\"modal-btn secondary\">View on GitHub</a>";}
      if(!project.links.live&&!project.links.github){footerHtml="<span class=\"modal-btn secondary\" style=\"cursor:default;opacity:0.6\">Links coming soon</span>";}
      modalFooter.innerHTML=footerHtml;
      document.body.classList.add("modal-open"); modalOverlay.classList.add("active"); modalContainer.classList.add("active");
    }
    function closeModal(){document.body.classList.remove("modal-open");modalOverlay.classList.remove("active");modalContainer.classList.remove("active")}
    modalOverlay.addEventListener("click",closeModal); modalClose.addEventListener("click",closeModal);
    modalContainer.addEventListener("click",function(e){if(e.target===modalContainer)closeModal()});
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
  </script>
